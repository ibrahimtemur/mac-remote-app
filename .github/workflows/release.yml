name: Release Pipeline

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-mac-release:
    name: Package macOS Application
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: "mac-app/requirements.txt"

      - name: Install Dependencies
        working-directory: mac-app
        run: |
          python3 -m pip install --upgrade pip setuptools wheel py2app
          pip install -r requirements.txt

      - name: Build macOS Application Bundle
        working-directory: mac-app
        run: |
          python3 setup.py py2app
          xattr -cr "dist/Mac Remote.app"
          codesign --force --deep --sign - "dist/Mac Remote.app"
          ditto -c -k --sequesterRsrc --keepParent "dist/Mac Remote.app" MacRemote-macOS.zip

      - name: Upload macOS Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MacRemote-macOS
          path: mac-app/MacRemote-macOS.zip
          retention-days: 1

  build-android-release:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "gradle"

      - name: Make Gradlew Executable
        working-directory: android-app
        run: chmod +x gradlew

      - name: Configure Android Signing Keystore
        id: keystore
        working-directory: android-app
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Keystore secret detected, decoding..."
            echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
            echo "has_keystore=true" >> $GITHUB_OUTPUT
          else
            echo "No keystore secret provided, fallback to debug build."
            echo "has_keystore=false" >> $GITHUB_OUTPUT
          fi

      - name: Build APK (Release or Debug Fallback)
        working-directory: android-app
        env:
          ANDROID_KEYSTORE_FILE: ${{ steps.keystore.outputs.has_keystore == 'true' && 'release.keystore' || '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ "${{ steps.keystore.outputs.has_keystore }}" = "true" ]; then
            ./gradlew assembleRelease --stacktrace
            cp app/build/outputs/apk/release/*.apk ../MacRemote-Android.apk
          else
            ./gradlew assembleDebug --stacktrace
            cp app/build/outputs/apk/debug/*.apk ../MacRemote-Android.apk
          fi

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MacRemote-Android
          path: MacRemote-Android.apk
          retention-days: 1

  publish-release:
    name: Publish GitHub Release
    needs: [build-mac-release, build-android-release]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download macOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: MacRemote-macOS
          path: release_artifacts

      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: MacRemote-Android
          path: release_artifacts

      - name: Extract Release Notes from CHANGELOG
        id: release_notes
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "Extracting release notes for version: $VERSION"
          # Extract the section between ## [VERSION] and the next ## [
          if grep -q "## \[$VERSION\]" CHANGELOG.md; then
            sed -n "/## \[$VERSION\]/,/## \[/p" CHANGELOG.md | sed '$d' > release_body.md
          else
            echo "Release $GITHUB_REF_NAME" > release_body.md
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_body.md
          files: |
            release_artifacts/MacRemote-Android.apk
          draft: false
          prerelease: false
